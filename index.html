<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up Form</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="side-bar">
        <div class="logo">
          <img src="images/odin-lined.png" alt="odin-logo" />
          <p>ODIN</p>
        </div>
        <div class="footer">
          Photo by <a href="#">Halie West</a> on <a href="#">Unsplash</a>
        </div>
      </div>
      <div class="content">
        <div class="hero-text">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
            <br />
            Sign up <span class="italic">now</span> to get started.
          </p>
          <p>You <span class="italic">know</span> you want to.</p>
        </div>
        <form action="" class="form-container">
          <div class="main-form-container">
            <div class="main-form">
              <p>Let's do this!</p>
              <div class="input-row">
                <div>
                  <label for="first-name">First Name</label>
                  <input type="text" id="first-name" name="first-name" />
                </div>
                <div>
                  <label for="last-name">Last Name</label>
                  <input type="text" id="last-name" name="last-name" />
                </div>
              </div>
              <div class="input-row">
                <div>
                  <label for="mail">Email</label>
                  <input type="email" id="mail" name="user-email" />
                </div>
                <div>
                  <label for="phone">Phone Number</label>
                  <input type="tel" id="phone" name="phone" />
                </div>
              </div>
              <div class="input-row">
                <div>
                  <label for="pwd">Password</label>
                  <input type="password" id="pwd" name="pwd" />
                </div>
                <div>
                  <label for="confirm-pwd">Confirm Password</label>
                  <input type="password" id="confirm-pwd" name="confirm-pwd" />
                </div>
              </div>
            </div>
          </div>

          <div class="button-section">
            <button>Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
